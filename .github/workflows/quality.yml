name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npx eslint src/modules src/app/api/aventura src/app/api/vocacional src/app/api/chat src/app/api/colegio/exploraciones src/app/colegio/exploraciones
      - run: npm run build
